[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amc-feedback-loop"
version = "0.1.2"
description = "AMC Human Feedback Loop module — captures feedback_records, builds unified evaluation records."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "NuSummit Technologies", email = "dev@nusummit.com"}
]
dependencies = [
    "pydantic>=2.7.1,<3.0.0",
    "pydantic-settings>=2.4.0",
    "vaderSentiment>=3.3.1",
    "spacy>=3.7.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.8.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.0",
    "gliner>=0.2.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "freezegun>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/feedback_loop", "src/amc_feedback"]
