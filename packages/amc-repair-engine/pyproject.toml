[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amc-repair-engine"
version = "0.1.0"
description = "Self-correcting repair engine with tiered evaluation, hot correction patches, and governance batch processing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "NuSummit Technologies", email = "dev@nusummit.com"}
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
redis = [
    "redis>=5.0",
]
neo4j = [
    "neo4j>=5.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/amc_repair"]
