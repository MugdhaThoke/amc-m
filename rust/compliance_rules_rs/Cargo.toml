[package]
name = "compliance_rules_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Build as dynamic library (.dll on Windows)

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
# rayon removed due to AppLocker - use threading instead

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
